<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HS1.1</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 95vh;
      gap: 15px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: 2px solid #ccc;
      border-radius: 8px;
      background: #fff;
    }
  </style>
</head>
<body>

  <h2>HTML File Previewer</h2>
  <div class="controls">
    <input type="file" id="fileInput" accept=".html,.htm" />
  </div>

  <!-- srcdoc=" " prevents the iframe from making server requests before a file is chosen -->
  <iframe id="previewFrame" srcdoc="<p style='color:#888; padding:20px;'>Upload an HTML file above to view it here.</p>" sandbox="allow-scripts"></iframe>

  <script>
    const fileInput = document.getElementById('fileInput');
    const iframe = document.getElementById('previewFrame');

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      
      // Check if file extension ends with .html or .htm
      if (file && file.name.toLowerCase().endsWith('.html') || file.name.toLowerCase().endsWith('.htm')) {
        const reader = new FileReader();
        
        reader.onload = (e) => {
          iframe.srcdoc = e.target.result;
        };
        
        reader.readAsText(file);
      } else {
        alert("Please select a valid .html file.");
      }
    });
  </script>

</body>
</html>
