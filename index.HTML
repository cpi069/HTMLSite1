<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HTML Runner</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 95vh;
      gap: 15px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: 2px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h2>HTML File Previewer</h2>
  <div class="controls">
    <input type="file" id="fileInput" accept=".html" />
  </div>

  <!-- Sandboxed iframe to safely render uploaded code -->
  <iframe id="previewFrame" sandbox="allow-scripts"></iframe>

  <script>
    const fileInput = document.getElementById('fileInput');
    const iframe = document.getElementById('previewFrame');

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file && file.type === "text/html") {
        const reader = new FileReader();
        
        reader.onload = (e) => {
          // Render the user's uploaded HTML into the iframe
          iframe.srcdoc = e.target.result;
        };
        
        reader.readAsText(file);
      } else {
        alert("Please select a valid .html file.");
      }
    });
  </script>

</body>
</html>
